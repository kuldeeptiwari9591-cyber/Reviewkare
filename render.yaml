services:
  - type: web
    name: reviewkare
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build && npm run typecheck && npm test
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BASE_URL
        value: https://reviewkare.in
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_GOOGLE_SIGN_IN
        value: "false"
      - key: HOSTING_REGION
        value: Singapore
      - key: DATABASE_REGION
        sync: false
      - key: BILLING_ENABLED
        value: "false"
      - key: BILLING_TERM_PRICES
        sync: false
      - key: BILLING_RECEIPT_FOOTER
        sync: false
      - key: TAX_POLICY_CONFIRMED
        value: "false"
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: JOBS_SECRET
        sync: false
      - key: LIFECYCLE_ENABLED
        value: "false"
      - key: LIFECYCLE_DELETE_ENABLED
        value: "false"
      - key: ADMIN_ENABLED
        value: "false"
      - key: ANALYTICS_ENABLED
        value: "false"
      - key: GOOGLE_POLICY_VERIFIED
        value: "false"
      - key: GRIEVANCE_OFFICER
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: OPERATOR_NAME
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_BUSINESS_ENABLED
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://reviewkare.in/api/google/callback
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      - key: BING_SITE_VERIFICATION
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: AI_DRAFTS_ENABLED
        value: "false"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: AI_MODELS
        sync: false
      - key: AI_REDACT_PII
        value: "true"
      - key: AI_MONTHLY_GENERATIONS
        value: "500"
      - key: AI_TENANT_MONTHLY_BUDGET_USD
        value: "1"
      - key: AI_MONTHLY_BUDGET_USD
        value: "20"
      - key: AI_TENANT_ALLOWLIST
        sync: false
